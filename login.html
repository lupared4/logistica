<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logística — Ingreso</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background: linear-gradient(135deg,#1a1f36 0%,#2d3a6e 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .login-card { background:#fff; border-radius:16px; box-shadow:0 24px 48px rgba(0,0,0,.35); padding:40px; width:380px; max-width:95vw; }
  .logo-box { width:64px; height:64px; background:#4f46e5; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.8rem; margin:0 auto 16px; }
</style>
</head>
<body>
<div class="login-card">
  <div class="text-center mb-4">
    <div class="logo-box">📦</div>
    <h2 class="fw-black fs-5 text-dark mb-0">STOCKS LOGÍSTICA</h2>
    <p class="text-muted small mt-1">Dashboard de Inventario</p>
  </div>

  {% if error %}
  <div class="alert alert-danger py-2 small">⚠️ {{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="mb-3">
      <label class="form-label fw-bold small">👤 Usuario</label>
      <input type="text" name="user" class="form-control" placeholder="Ingrese su usuario" autocomplete="username" required>
    </div>
    <div class="mb-4">
      <label class="form-label fw-bold small">🔒 Contraseña</label>
      <input type="password" name="password" class="form-control" placeholder="Ingrese su contraseña" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Ingresar</button>
  </form>

  <p class="text-center text-muted small mt-4 mb-0">© 2026 — Sistema de Gestión de Inventario</p>
</div>
</body>
</html>
